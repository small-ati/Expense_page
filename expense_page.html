<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>个人记账本</title>
    <style>
        body { font-family: Arial; margin: 30px; }
        input, select, button { padding: 5px; margin: 3px; }
        #expense-list { margin-top: 15px; }
        .expense-item { padding: 5px; border-bottom: 1px solid #eee; }
        #total { font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <h1>个人记账本</h1>

    <input type="text" id="item-name" placeholder="消费项目">
    <input type="number" id="item-amount" placeholder="金额">
    <select id="item-category">
        <option value="food">餐饮</option>
        <option value="transport">交通</option>
        <option value="shopping">购物</option>
        <option value="other">其他</option>
    </select>
    <button id="add-btn" onclick="addExpense()">添加</button>

    <p>总支出：<span id="total">0</span> 元</p>
    <div id="expense-list"></div>

    <script>
        let expenses = [];

        function addExpense() {
            const name = document.getElementById('item-name').value.trim();
            const amount = parseFloat(document.getElementById('item-amount').value);
            const category = document.getElementById('item-category').value;

            if (name === '' || isNaN(amount) || amount <= 0) {
                alert('请输入有效的消费项目和金额');
                return;
            }

            expenses.push({ name: name, amount: amount, category: category });
            document.getElementById('item-name').value = '';
            document.getElementById('item-amount').value = '';
            renderList();
        }

        function renderList() {
            const list = document.getElementById('expense-list');
            list.innerHTML = '';

            expenses.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'expense-item';
                div.id = 'expense-' + index;

                const span = document.createElement('span');
                span.innerText = item.name + ' - ' + item.amount + ' 元 (' + item.category + ')';

                const delBtn = document.createElement('button');
                delBtn.innerText = '删除';
                delBtn.onclick = () => deleteExpense(index);

                div.appendChild(span);
                div.appendChild(delBtn);
                list.appendChild(div);
            });

            const total = expenses.reduce((sum, item) => sum + item.amount, 0);
            document.getElementById('total').innerText = total;
        }

        function deleteExpense(index) {
            expenses.splice(index, 1);
            renderList();
        }
    </script>
</body>
</html>
